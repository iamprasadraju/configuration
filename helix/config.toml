# Color Scheme
theme = "geohot"

[editor]
line-number = "absolute"
mouse = true
true-color = true
auto-save = true
bufferline = "always"
color-modes = true
gutters = ["diff", "spacer", "line-numbers", "spacer"]
clipboard-provider = "pasteboard"  # Correctly activates native macOS clipboard handling


[editor.soft-wrap]
enable = true
wrap-indicator = "↩ "

[editor.cursor-shape]
normal = "block"
insert = "block"
select = "underline"

[editor.indent-guides]
render = false
character = "│"

[editor.lsp]
enable = false
snippets = true

[editor.file-picker]
hidden = false

[editor.inline-diagnostics]
cursor-line = "disable"

# Keybindings
[keys.normal]
"space"."w" = ":write"
"space"."q" = ":quit"
"g" = { "]" = ":buffer-next", "[" = ":buffer-previous" }
"A-=" = ":write-all"
"tab" = "goto_next_function"
"S-tab" = "goto_prev_function"
"A-j" = "move_line_down"
"A-k" = "move_line_up"

[keys.insert]
ins = "normal_mode"
