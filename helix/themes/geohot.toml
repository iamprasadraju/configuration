# geohot - exact replica of George Hotz's vim setup (github.com/geohot/configuration)
# vim: default colorscheme + "highlight Comment ctermfg=green", no cursorline, hlsearch on
# terminal: classic Geohot charcoal palette (#1F1E1F bg, #FFFFFF fg)
# UI chrome from his .tmux.conf: status-bg colour234 #1C1C1C, status-fg colour137 #AF875F

"ui.background" = { bg = "bg" }
"ui.overlay" = { bg = "bg" }

"ui.text" = "fg"
"ui.text.focus" = "fg"
"ui.text.inactive" = "dim"
"ui.text.primary" = "fg"
"ui.text.select" = { fg = "bg", bg = "fg" }

"ui.cursor" = { fg = "bg", bg = "cursor" }
"ui.cursor.primary" = { fg = "bg", bg = "cursor" }
"ui.cursor.primary.insert" = { fg = "bg", bg = "cursor" }
"ui.cursor.secondary" = { fg = "bg", bg = "dim" }
"ui.cursor.match" = { fg = "bg", bg = "cyan" }
"ui.cursorline" = "bg"
"ui.cursorline.primary" = "bg"

"ui.selection" = { fg = "bg", bg = "fg" }
"ui.selection.primary" = { fg = "bg", bg = "fg" }

"ui.linenr" = "yellow"
"ui.linenr.selected" = "yellow"
"ui.gutter" = "bg"

"ui.statusline" = { fg = "tan", bg = "chrome" }
"ui.statusline.inactive" = { fg = "dim", bg = "chrome" }
"ui.statusline.separator" = { fg = "tan", bg = "chrome" }

"ui.bufferline" = { fg = "dim", bg = "chrome" }
"ui.bufferline.active" = { fg = "fg", bg = "chrome" }
"ui.bufferline.selected" = { fg = "fg", bg = "chrome" }
"ui.bufferline.background" = "chrome"

"ui.popup" = { fg = "fg", bg = "panel" }
"ui.popup.info" = { fg = "fg", bg = "panel" }
"ui.popup.debug" = { fg = "dim", bg = "panel" }
"ui.window" = { fg = "dim", bg = "panel" }
"ui.help" = { fg = "fg", bg = "panel" }

"ui.menu" = { fg = "fg", bg = "panel" }
"ui.menu.selected" = { fg = "bg", bg = "fg" }
"ui.menu.selected.primary" = { fg = "bg", bg = "fg" }
"ui.menu.scroll" = "dim"
"ui.menu.scroll.focused" = "dim"
"ui.picker" = { fg = "fg", bg = "panel" }
"ui.picker.help" = { fg = "dim", bg = "panel" }

"ui.highlight" = { fg = "bg", bg = "fg" }
"ui.highlight.frameborder" = "dim"

"ui.virtual.whitespace" = "dim"
"ui.virtual.indent-guide" = "dim"
"ui.virtual.inlay-hints" = "dim"
"ui.virtual.wrap" = "dim"

"ui.diagnostics.error" = "red"
"ui.diagnostics.warning" = "yellow"
"ui.diagnostics.info" = "cyan"
"ui.diagnostics.hint" = "dim"
"ui.diagnostics.unnecessary" = "dim"

"ui.info" = "cyan"
"ui.error" = "red"
"ui.warning" = "yellow"

comment = "green"
constructor = "cyan"
attribute = "magenta"
namespace = "fg"
keyword = "yellow"
"keyword.storage" = "green"
"keyword.operator" = "yellow"
"keyword.directive" = "magenta"
"keyword.control" = "yellow"
"keyword.control.import" = "magenta"
"keyword.exception" = "yellow"
"keyword.return" = "yellow"
label = "yellow"
type = "green"
"type.builtin" = "green"

constant = "red"
"constant.builtin" = "red"
"constant.numeric" = "red"
"constant.character" = "red"
"constant.macro" = "magenta"
boolean = "red"

string = "red"
"string.special" = "magenta"
"string.escape" = "magenta"
"string.regexp" = "red"

function = "cyan"
"function.macro" = "magenta"
"function.special" = "magenta"
"function.method" = "cyan"

variable = "fg"
"variable.builtin" = "fg"
"variable.other.member" = "fg"
"variable.parameter" = "fg"

operator = "yellow"
"operator.special" = "yellow"
punctuation = "fg"
"punctuation.delimiter" = "fg"
"punctuation.bracket" = "fg"
"punctuation.special" = "magenta"

"markup.heading" = "cyan"
"markup.bold" = "fg"
"markup.italic" = "fg"
"markup.link" = "magenta"
"markup.list" = "yellow"
"markup.quote" = "green"
"markup.raw" = "fg"

[palette]
bg       = "#000000"
fg       = "#FFFFFF"
cursor   = "#4C4C4C"
dim      = "#707070"
chrome   = "#1C1C1C"
tan      = "#AF875F"
panel    = "#626262"
red      = "#822121"
green    = "#00A800"
yellow   = "#B0B000"
cyan     = "#20B0B0"
magenta  = "#B020C0"