# rusty_grey - minimal warm theme, dark grey chrome (royal red / brown / cream)

"ui.background" = { bg = "bg" }
"ui.overlay" = { bg = "overlay" }

"ui.text" = "cream"
"ui.text.focus" = "cream"
"ui.text.inactive" = "cream_faint"
"ui.text.primary" = "cream"
"ui.text.select" = { fg = "bg", bg = "purple_light" }

"ui.cursor" = { fg = "bg", bg = "cream" }
"ui.cursor.primary" = { fg = "bg", bg = "cream" }
"ui.cursor.primary.insert" = { fg = "bg", bg = "red" }
"ui.cursor.secondary" = { fg = "bg", bg = "gray_mid" }
"ui.cursor.match" = { fg = "cream", bg = "chrome" }
"ui.cursorline" = "red_deep"
"ui.cursorline.primary" = "red_deep"

"ui.selection" = { fg = "bg", bg = "purple_light" }
"ui.selection.primary" = { fg = "bg", bg = "purple_light" }

"ui.linenr" = "linenr"
"ui.linenr.selected" = "cream"
"ui.gutter" = "bg"

"ui.statusline" = { fg = "cream", bg = "chrome" }
"ui.statusline.inactive" = { fg = "cream_dim", bg = "panel" }
"ui.statusline.separator" = { fg = "linenr", bg = "chrome" }

"ui.bufferline" = { fg = "cream_dim", bg = "panel" }
"ui.bufferline.active" = { fg = "cream", bg = "chrome" }
"ui.bufferline.selected" = { fg = "cream", bg = "chrome" }

"ui.popup" = { fg = "cream", bg = "panel" }
"ui.popup.info" = { fg = "cream", bg = "panel" }
"ui.popup.debug" = { fg = "cream_dim", bg = "panel" }
"ui.window" = { fg = "cream_dim", bg = "panel" }
"ui.help" = { fg = "cream", bg = "panel" }

"ui.menu" = { fg = "cream", bg = "panel" }
"ui.menu.selected" = { fg = "cream", bg = "gray_mid" }
"ui.menu.selected.primary" = { fg = "cream", bg = "chrome" }
"ui.menu.scroll" = "linenr"
"ui.menu.scroll.focused" = "gray_mid"
"ui.picker" = { fg = "cream", bg = "panel" }
"ui.picker.help" = { fg = "cream_dim", bg = "panel" }

"ui.highlight" = { fg = "cream", bg = "chrome" }
"ui.highlight.frameborder" = "linenr"

"ui.virtual.whitespace" = "guide"
"ui.virtual.indent-guide" = "guide"
"ui.virtual.inlay-hints" = "cream_faint"
"ui.virtual.wrap" = "linenr"

"ui.diagnostics.error" = "error_red"
"ui.diagnostics.warning" = "tan_soft"
"ui.diagnostics.info" = "cream_dim"
"ui.diagnostics.hint" = "cream_faint"
"ui.diagnostics.unnecessary" = "linenr"

"ui.info" = "tan_soft"
"ui.error" = "error_red"
"ui.warning" = "tan_soft"

comment = "purple"
constructor = "tan_bright"
attribute = "tan_soft"
keyword = "red"
"keyword.storage" = "red"
"keyword.operator" = "red"
"keyword.directive" = "red"
"keyword.control" = "red"
"keyword.control.import" = "purple"
"keyword.exception" = "red"
"keyword.return" = "red"
label = "red"
namespace = "red"

constant = "tan_soft"
"constant.builtin" = "tan_soft"
"constant.numeric" = "tan_soft"
"constant.character" = "tan_soft"
"constant.macro" = "tan_soft"
boolean = "tan_soft"

string = "tan"
"string.special" = "tan_soft"
"string.escape" = "red"
"string.regexp" = "tan"

type = "tan_bright"
"type.builtin" = "tan_bright"

function = "cream"
"function.macro" = "tan_soft"
"function.special" = "cream"
"function.method" = "tan_bright"

variable = "cream"
"variable.builtin" = "cream"
"variable.other.member" = "tan_soft"
"variable.parameter" = "cream"

operator = "cream_dim"
"operator.special" = "red"
punctuation = "cream_dim"
"punctuation.delimiter" = "cream_dim"
"punctuation.bracket" = "cream_dim"
"punctuation.special" = "tan_soft"

"markup.heading" = "red"
"markup.bold" = "cream"
"markup.italic" = "cream"
"markup.link" = { fg = "tan_soft", underline = { style = "line" } }
"markup.list" = "red"
"markup.quote" = "brown"
"markup.raw" = "tan"

[palette]
bg          = "#202020"
panel       = "#424242"
overlay     = "#191919"
red         = "#B53A3A"
red_dark    = "#8E2B2B"
red_deep    = "#4A4A4A"
brown       = "#9C6B3F"
brown_dark  = "#6E4A2A"
purple      = "#7851A9"
purple_light = "#B39DDB"
silver      = "#A0A6AF"
cream       = "#EDE3D5"
cream_dim   = "#A89883"
cream_faint = "#8F8170"
tan         = "#D9C7A8"
tan_bright  = "#D9A05B"
tan_soft    = "#C98F5E"
guide       = "#4A4A4A"
chrome      = "#484848"
gray_mid    = "#525252"
linenr      = "#808080"
error_red   = "#D96A6A"