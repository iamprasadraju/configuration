editor codium --goto %f:%l

shell_integration no-cursor
pixel_scroll yes
momentum_scroll 0.96



# Enable cursor trail and set decay timings
cursor_trail 10
cursor_trail_decay 0.05 0.75
cursor_trail_start_threshold 0
cursor_shape block

repaint_delay 7


# BEGIN_KITTY_THEME
# Modus Vivendi
include current-theme.conf
# END_KITTY_THEME


# BEGIN_KITTY_FONTS
font_family      family=Menlo postscript_name=Menlo-Regular
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS