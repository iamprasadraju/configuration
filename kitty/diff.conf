# Always render diffs in GitHub Dark Plus style
color_scheme dark

# Base — GitHub Dark
dark_foreground            #e6edf3
dark_background            #000000

# Title bar / margins
dark_title_fg              #e6edf3
dark_title_bg              #161b22
dark_margin_bg             #161b22
dark_margin_fg             #8b949e
dark_removed_margin_bg     #161b22
dark_added_margin_bg       #161b22
dark_moved_margin_bg       #161b22

# Empty padding lines
dark_filler_bg             #0d1117

# Removed — GitHub red
dark_removed_bg            #3a0404
dark_highlight_removed_bg  #82141d

# Added — GitHub green
dark_added_bg              #022e04
dark_highlight_added_bg    #0f8831

# Moved — GitHub yellow
dark_moved_bg              #2b2618

# Hunk headers — GitHub blue
dark_hunk_margin_bg        #212222
dark_hunk_bg               #222222

# Syntax highlighting — GitHub Dark
dark_pygments_style        github-dark